version: '3.8'

services:
  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-045:latest
    container_name: crm-045-app
    ports:
      - "8080:8080"
    environment:
      # JVM Options
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      
      # Spring Boot Configuration
      SPRING_PROFILES_ACTIVE: docker
      
      # Database Configuration (external service - configure as needed)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-host:3306/crm?useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      
      # JPA/Hibernate Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      
      # Management/Actuator Configuration
      MANAGEMENT_SECURITY_ENABLED: "false"
      MANAGEMENT_CONTEXT_PATH: /appinfo
      
      # Thymeleaf Configuration
      SPRING_THYMELEAF_CACHE: "false"
      SPRING_THYMELEAF_MODE: LEGACYHTML5
      
      # Timezone
      TZ: UTC
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - crm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/appinfo/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  crm-network:
    driver: bridge

volumes:
  logs:
  config:
