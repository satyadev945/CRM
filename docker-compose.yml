version: '3.8'

services:
  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-container:latest
    container_name: crm-application
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=crm
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - DDL_AUTO=update
      - TZ=UTC
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - crm-network
    restart: unless-stopped
    depends_on:
      - mysql-db
    healthcheck:
      test: ["CMD", "sh", "-c", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mysql-db:
    image: mysql:5.7
    container_name: crm-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=crm
      - MYSQL_USER=crmuser
      - MYSQL_PASSWORD=password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - crm-network
    restart: unless-stopped

networks:
  crm-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
