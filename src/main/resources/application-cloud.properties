# Cloud-specific configuration profile for AWS deployment
# Activate this profile by setting SPRING_PROFILES_ACTIVE=cloud

# Database Configuration - All from environment variables
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP Connection Pool - Optimized for cloud
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# Management/Actuator - Secured for cloud
management.security.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Thymeleaf - Cache enabled for production
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true

# Logging - JSON format for CloudWatch
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.root=INFO
logging.level.crm=INFO

# AWS Configuration
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.stack.auto=false
