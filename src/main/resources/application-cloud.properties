# Cloud-specific configuration profile
# Activate with: --spring.profiles.active=cloud

# Database Configuration for Cloud
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool - Optimized for cloud
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# Thymeleaf - Enable caching in cloud
spring.thymeleaf.cache=true

# Actuator - Cloud monitoring endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=cloud

# Server Configuration
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Logging for Cloud
logging.level.root=INFO
logging.level.crm=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# Security
server.error.include-message=never
server.error.include-stacktrace=never

# Session management for cloud (stateless)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
