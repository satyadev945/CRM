# Cloud-specific configuration (AWS)

# Database configuration (RDS)
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Database connection pooling
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Thymeleaf configuration
spring.thymeleaf.cache=true

# Logging
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.crm=INFO

# Cloud AWS configuration
cloud.aws.region.auto=true
cloud.aws.stack.auto=false

# Disable Spring auto-cloud config to use our explicit configuration
spring.cloud.aws.credentials.instance-profile=true
spring.cloud.aws.credentials.profile-name=default

# AWS S3 configuration
aws.s3.bucket=${AWS_S3_BUCKET:crm-documents}
aws.region=${AWS_REGION:us-east-1}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# Server
server.port=${PORT:8080}