<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <title>CSV show</title>
</head>
<body>

<table>
    <thead>
    <tr>
        <th>ROW</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="d : ${data}">
        <td th:text="${d}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
