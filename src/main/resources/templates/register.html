<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self';"/>
<h2>Register</h2>
<form th:action="@{/register}" th:object="${user}" method="post">
    <div>
        <input type="hidden" th:field="*{id}" />
    </div>
    <div>
        <label>
            Username:
            <input type="text" th:field="*{username}"/>
        </label>
    </div>
    <div>
        <label>
            Email:
            <input type="email" th:field="*{email}"/>
        </label>
    </div>
    <div>
        <label>
            Password:
            <input type="password" th:field="*{password}"/>
        </label>
    </div>
    <div>
        <label>
            First Name:
            <input type="text" th:field="*{firstName}"/>
        </label>
    </div>
    <div>
        <label>
            Last Name:
            <input type="text" th:field="*{lastName}"/>
        </label>
    </div>
    <div>
        <input type="submit" value="Register"/>
    </div>
</form>

</body>
</html>
