# Database Configuration - Using Environment Variables for Cloud Deployment
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# HikariCP Connection Pool Configuration for Cloud
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION:60000}

# Management Endpoints - Secured for Cloud
management.security.enabled=${MANAGEMENT_SECURITY_ENABLED:true}
management.endpoints.web.base-path=${MANAGEMENT_CONTEXT_PATH:/appinfo}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Server Configuration - Port from Environment
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.http2.enabled=true

# Logging Configuration for Cloud - JSON Format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.root=${LOG_LEVEL:INFO}
logging.level.crm=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.hibernate=${HIBERNATE_LOG_LEVEL:WARN}

# AWS Cloud Configuration
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.region.auto=false
cloud.aws.stack.auto=false
cloud.aws.s3.bucket=${S3_BUCKET:crm-documents}

# Spring Boot Actuator
info.app.name=minicompcrm
info.app.description=CRM Application - Cloud Ready
info.app.version=1.0.0
info.app.encoding=${project.build.sourceEncoding}
info.app.java.version=${java.version}

# Security Configuration
spring.security.user.name=${SECURITY_USER:admin}
spring.security.user.password=${SECURITY_PASSWORD:admin}

# Session Configuration - Stateless for Cloud
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# JPA Configuration
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.open-in-view=false
