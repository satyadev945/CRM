# Database Configuration - Use environment variables for cloud deployment
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# Management/Actuator Configuration
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# AWS S3 Configuration - Cloud-native storage settings
# These can be overridden by environment variables in cloud deployments
aws.s3.bucket.name=${S3_BUCKET_NAME:crm-data-bucket}
aws.s3.bucket.pdf=${S3_PDF_BUCKET:crm-pdf-bucket}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.pdf.prefix=${S3_PDF_PREFIX:pdfs/}

# Timezone Configuration - Standardized on UTC for cloud consistency
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ

# Logging Configuration - Structured logging for cloud monitoring
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.crm=INFO
logging.level.software.amazon.awssdk=WARN
