spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# Azure Blob Storage configuration
# Set AZURE_STORAGE_CONNECTION_STRING environment variable with the Azure Storage account connection string
# Set AZURE_STORAGE_CONTAINER_NAME environment variable with the target blob container name (default: crm-files)
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:crm-files}
