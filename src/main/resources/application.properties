spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false

# AWS S3 Configuration for cloud-native storage
# These should be overridden by environment variables in production
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:crm-pdf-bucket}
aws.s3.pdf.prefix=${AWS_S3_PDF_PREFIX:pdfs/}
aws.s3.csv.prefix=${AWS_S3_CSV_PREFIX:csv/}
aws.region=${AWS_REGION:us-east-1}

# Cloud-native time configuration
# Always use UTC for database storage and inter-service communication
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.thymeleaf.cache=false
