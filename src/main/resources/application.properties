# Database configuration using environment variables
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/crm?useSSL=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Connection pooling
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.base-path=/appinfo
management.endpoint.health.show-details=when_authorized

# Thymeleaf configuration
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}

# Server configuration
server.port=${PORT:8080}

# SSL Configuration (disabled by default, enable in production)
# server.ssl.enabled=${SERVER_SSL_ENABLED:false}
# server.ssl.key-store=${SERVER_SSL_KEYSTORE:classpath:keystore.p12}
# server.ssl.key-store-password=${SERVER_SSL_KEYSTORE_PASSWORD:password}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=tomcat

# AWS Specific Configuration
aws.s3.bucket=${AWS_S3_BUCKET:crm-documents}
aws.region=${AWS_REGION:us-east-1}
