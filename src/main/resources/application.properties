# Database Configuration - Use environment variables for cloud deployment
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=true&requireSSL=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# Management/Actuator Configuration - Secure endpoints for cloud
management.security.enabled=${MANAGEMENT_SECURITY_ENABLED:true}
management.context-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics

# Thymeleaf Configuration - Cloud-optimized
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=${TEMPLATE_CACHE:true}
