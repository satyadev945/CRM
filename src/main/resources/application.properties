spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# -----------------------------------------------------------------------
# AWS S3 Configuration (cloud-native object storage)
# Override these via environment variables in cloud deployments:
#   AWS_REGION, AWS_S3_BUCKET_NAME
# AWS credentials are resolved via the default credential provider chain:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars, or IAM instance role
# -----------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:crm-pdf-storage}
aws.s3.pdf-prefix=${AWS_S3_PDF_PREFIX:pdfs/}
aws.s3.csv-prefix=${AWS_S3_CSV_PREFIX:csv/}
