apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-app
  namespace: crm-app
  labels:
    app: crm-app
    version: v1
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm-app
  template:
    metadata:
      labels:
        app: crm-app
        version: v1
        component: backend
    spec:
      containers:
      - name: crm-app
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: SERVER_PORT
          value: "8080"
        - name: DDL_AUTO
          value: "{{DDL_AUTO}}"
        - name: DB_URL
          value: "{{DB_URL}}"
        - name: DB_USER
          value: "{{DB_USER}}"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crm-db-secret
              key: password
              optional: true
        - name: TZ
          value: "UTC"
        - name: JAVA_OPTS
          value: "-Xmx768m -Xms384m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /appinfo/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /appinfo/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: config
        configMap:
          name: crm-app-config
          optional: true
      - name: logs
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-db-secret
  namespace: crm-app
type: Opaque
stringData:
  password: "{{DB_PASSWORD}}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-app-config
  namespace: crm-app
data:
  application.properties: |
    # Application configuration
    server.port=8080
    management.context-path=/appinfo
    management.security.enabled=false